[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quicktype-windows"
version = "1.25.0"
description = "Private, portable text expander for Windows 11"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "PySide6>=6.8,<7",
    "comtypes>=1.4,<2",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.11,<7"]
test = ["pytest>=9.0.3,<10", "pytest-cov>=6,<8"]
quality = [
    "mypy>=1.14,<2",
    "pip-audit>=2.7,<3",
    "ruff>=0.9,<1",
]

[project.scripts]
quicktype = "quicktype.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quicktype = ["resources/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
