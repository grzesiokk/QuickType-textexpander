name: Windows build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build,test,quality]"

      - name: Prepare report directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force build | Out-Null

      - name: Lint
        run: ruff check src tests scripts

      - name: Check core types
        run: >-
          mypy
          src/quicktype/models.py
          src/quicktype/storage.py
          src/quicktype/backup.py
          src/quicktype/backup_catalog.py
          src/quicktype/auto_backup.py
          src/quicktype/matcher.py
          src/quicktype/diagnostics.py
          src/quicktype/importing.py
          src/quicktype/recovery.py
          src/quicktype/maintenance.py

      - name: Run tests with coverage
        run: >-
          python -m pytest
          --cov=quicktype
          --cov-report=term
          --cov-report=xml:build/coverage.xml
          --cov-fail-under=72

      - name: Audit dependencies and create SBOM
        run: >-
          pip-audit
          --local
          --skip-editable
          --progress-spinner off
          --format cyclonedx-json
          --output build/QuickType-sbom.json

      - name: Build QuickType.exe
        shell: pwsh
        run: .\build.ps1 -SkipInstall

      - name: Smoke test portable executable
        shell: pwsh
        run: .\scripts\smoke_exe.ps1

      - name: Show executable checksum
        shell: pwsh
        run: Get-FileHash .\dist\QuickType.exe -Algorithm SHA256

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: QuickType-Windows-${{ github.sha }}
          path: dist/QuickType.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload quality reports
        uses: actions/upload-artifact@v7
        with:
          name: QuickType-quality-${{ github.sha }}
          path: |
            build/coverage.xml
            build/QuickType-sbom.json
          if-no-files-found: error
          retention-days: 14
