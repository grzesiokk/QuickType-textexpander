name: Windows build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build,test]"

      - name: Run tests
        run: python -m pytest

      - name: Build QuickType.exe
        shell: pwsh
        run: .\build.ps1 -SkipInstall

      - name: Show executable checksum
        shell: pwsh
        run: Get-FileHash .\dist\QuickType.exe -Algorithm SHA256

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: QuickType-Windows-${{ github.sha }}
          path: dist/QuickType.exe
          if-no-files-found: error
          retention-days: 14
